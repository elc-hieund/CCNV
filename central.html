<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRUNG TÂM ĐIỀU HÀNH CẤP CỨU NGOẠI VIỆN — THÀNH PHỐ CẦN THƠ</title>
  
  <!-- CSS Design System adhering strictly to design_rule.md -->
  <link rel="stylesheet" href="css/tokens.css?v=20261005_01" />
  <link rel="stylesheet" href="css/global.css?v=20261005_01" />
  <link rel="stylesheet" href="css/desktop.css?v=20261005_03" />
  <!-- Leaflet GIS Real World Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-container">
    <!-- MAIN SHELL: SIDEBAR ON THE LEFT (FULL HEIGHT 100vh), MAIN AREA ON THE RIGHT -->
    <div class="app-layout-shell">
      <!-- 1. LEFT SIDEBAR (Từ trên cùng xuống hết chiều cao, giống hệt ảnh mẫu) -->
      <aside class="command-sidebar" id="main-command-sidebar">
        <!-- Top Brand Header with Logo & Collapse Toggle Button -->
        <div class="sidebar-top-brand">
          <div class="brand-left">
            <div class="medical-cross-icon" style="width:28px;height:28px;border-radius:6px;flex-shrink:0;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
              </svg>
            </div>
            <span class="sidebar-brand-title">Cấp Cứu 115 Cần Thơ</span>
          </div>
          <button class="sidebar-toggle-btn" id="btn-toggle-sidebar" title="Thu gọn / Mở rộng Menu">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- Accordion Nav Menu Container -->
        <div id="sidebar-menu-wrapper" class="sidebar-nav-container">
          <!-- Dynamically populated accordion menu -->
        </div>

        <!-- Bottom Footer: 2026 © Design by elcom -->
        <div class="sidebar-bottom-footer" id="sidebar-bottom-footer">
          <span class="footer-copyright-text">
            2026 © Design by
          </span>
          <a href="https://elcom.com.vn" target="_blank" rel="noopener noreferrer" class="footer-brand-logo" id="sidebar-footer-logo" title="Elcom Corporation">
            <img src="assets/Logo Elcom-dark.svg" alt="Elcom Logo" style="height:14px;width:auto;display:block;opacity:0.9;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.9'" />
          </a>
        </div>
      </aside>

      <!-- 2. RIGHT MAIN WRAPPER (HEADER NẰM BÊN PHẢI SIDEBAR + VIEWPORT BÊN DƯỚI) -->
      <div class="app-main-wrapper">
        <!-- HEADER (Nằm hoàn toàn bên phải Nav bar) -->
        <header class="command-header">
          <div class="header-left"></div>

          <!-- Header Center: Thống kê nhanh & Browser-like Case Tabs -->
          <div class="header-stats-widget" id="header-stats-widget">
            <div class="header-stat-pill ready-pill" title="Số xe sẵn sàng / Tổng số xe">
              <span class="stat-dot green"></span>
              <span class="stat-label">Sẵn sàng:</span>
              <strong class="stat-val" id="header-stat-ready">04/06</strong>
            </div>

            <div class="header-stat-pill emergency-pill" title="Xe đang đi cấp cứu (SOS)">
              <span class="stat-dot red-pulse"></span>
              <span class="stat-label">Đang cấp cứu:</span>
              <strong class="stat-val" id="header-stat-emergency">01</strong>
            </div>

            <!-- Ca đang xử lý (Hiển thị kiểu Browser Tabs - Tối đa 2 ca gần nhất + badge tổng ca) -->
            <div class="header-cases-tabs-container" id="header-cases-tabs">
              <!-- Dynamically generated by updateKpiBar() -->
            </div>
          </div>

          <div class="header-right">
            <!-- Nút chạy kịch bản demo (Ẩn nút riêng, hành động chuyển sang quả chuông thông báo) -->
            <button type="button" class="btn-demo-start" id="btn-demo-start" style="display:none;" title="Chạy kịch bản demo">
              <span class="btn-demo-dot" aria-hidden="true"></span>
              <span class="btn-demo-label">Bắt đầu</span>
            </button>

            <!-- Đồng hồ & Ngày tháng (Ngày tháng năm - Giờ phút giây trên cùng 1 dòng) -->
            <div class="header-clock-widget" title="Thời gian hệ thống">
              <div class="clock-display" id="header-live-datetime" style="white-space:nowrap;font-size:12.5px;font-family:var(--font-mono);">
                <span id="header-live-date">02/10/2026</span> - <span id="header-live-clock">10:31:24</span>
              </div>
            </div>

            <!-- Nút thông báo khẩn cấp -->
            <button class="bell-btn" id="btn-header-bell" title="Thông báo khẩn cấp">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <span class="bell-badge">1</span>
            </button>

            <!-- Nút Tài khoản / Đăng xuất dạng 1 Icon hình tròn duy nhất -->
            <button class="header-avatar-icon-btn" id="btn-logout" title="Nguyễn Văn An (Điều phối viên) - Click để Đăng xuất">
              <div class="user-avatar-circle" id="header-user-avatar">NV</div>
            </button>
          </div>
        </header>

        <!-- CONTENT BODY: Viewport bên dưới -->
        <main class="content-body">


          <!-- Dynamic Main Content Viewport -->
          <div id="main-content-viewport" class="content-viewport-container">
            <!-- Rendered dynamically by CentralApp -->
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- 5. LARGE DRAWER: CREATE CASE & DISPATCH (Root Body Level Overlay) -->
  <div class="drawer-overlay" id="drawer-create-case-overlay">
    <!-- Injected by CentralApp -->
  </div>

  <!-- 6. DEDICATED LOGIN SCREEN (Root Body Level Overlay) -->
  <div class="login-screen-overlay" id="login-screen-overlay">
    <div class="login-modal-card">
      <div class="login-brand-header">
        <div class="login-cross-icon pulse-red">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
          </svg>
        </div>
        <h2>TRUNG TÂM ĐIỀU HÀNH CẤP CỨU</h2>
        <p>HỆ THỐNG ĐIỀU HÀNH CẤP CỨU NGOẠI VIỆN · THÀNH PHỐ CẦN THƠ</p>
      </div>

      <form class="login-form-box" id="login-form">
        <div class="form-field">
          <label class="form-label">Tài khoản / Mã định danh</label>
          <input type="text" id="login-username-input" placeholder="ví dụ: dpv01, bvtu.tn" value="dpv01" required />
        </div>
        <div class="form-field">
          <label class="form-label">Mật khẩu</label>
          <input type="password" id="login-password-input" value="••••••••" required />
        </div>

        <button type="submit" class="btn btn-emergency btn-lg" style="width:100%;margin-top:8px;">
          <span>ĐĂNG NHẬP VÀO HỆ THỐNG</span>
        </button>
      </form>

      <div class="login-quick-accounts-list" id="login-quick-accounts-list" style="margin-top: 16px;">
        <!-- Dynamically populated from data.json accounts -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/shared/data-seed.js?v=20261005_12"></script>
  <script src="js/shared/data-loader.js?v=20261005_12"></script>
  <script src="js/shared/components.js?v=20261005_12"></script>
  <!-- Leaflet GIS Real World Map Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/shared/map.js?v=20261005_14"></script>
  <script src="js/shared/epcr-form.js?v=20261005_12"></script>
  <script src="js/central/central-app.js?v=20261005_29"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.CentralApp.init();
    });
  </script>
</body>
</html>
